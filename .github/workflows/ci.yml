name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            my-backend/package-lock.json
            my-frontend/package-lock.json
      - name: Install and test backend
        working-directory: my-backend
        run: |
          npm ci
          npm test
      - name: Install, test and build frontend
        working-directory: my-frontend
        run: |
          npm ci
          npm test -- --watchAll=false --runInBand
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test chatbot and evaluate offline regression set
        working-directory: chatbot
        run: |
          pip install -r requirements-dev.txt
          pytest
          python -m evaluation.run --min-recall 0.95 --min-f1 0.95
      - name: Upload chatbot regression report
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-offline-regression
          path: chatbot/evaluation/reports/
